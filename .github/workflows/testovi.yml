# v95 (recenzija vijeća v94): testovi pri svakoj promjeni — PHP jedinični testovi, admin, API, potvrda e-mailom, SMTP i paket.
# Testovi preglednika (e2e, proba, pdf417) traže Playwright i pokreću se ručno (tests/README.md).
name: Testovi
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testovi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']  # v96: lokalni testovi 8.3, hosting 8.4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP jedinični testovi
        run: php tests/run.php
      - name: Admin
        run: php tests/admin.php
      - name: Paket
        run: python3 tests/paket.py
      - name: Stariji preglednici (v100)
        run: |
          npm install --no-save --no-audit --no-fund eslint@10.1.0
          node tests/compat.js
      - name: API, potvrda e-mailom i SMTP (lokalni PHP poslužitelj)
        run: |
          for t in api confirm smtp; do
            sh tests/serve.sh > /tmp/srv.log 2>&1 &
            SRV=$!
            for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8090/ && break; sleep 0.5; done
            node tests/$t.js || { kill $SRV; cat /tmp/srv.log | tail -20; exit 1; }
            kill $SRV; wait $SRV 2>/dev/null || true
          done
